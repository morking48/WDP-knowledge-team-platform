# ==============================================================================
# WDP 团队 AI 工作台 — WebUI Deployment
# ==============================================================================
# 作用：
#   部署多用户 WebUI 前端服务，2 副本提供高可用。
#   每个副本分配 4C8G 资源，通过共享 PVC 访问团队知识库和用户目录。
#
# 设计说明：
#   - replicas=2: 双副本保证可用性，配合 Ingress sticky session 实现会话保持
#   - resources: requests=2C4G, limits=4C8G，保证调度质量同时防止资源耗尽
#   - 挂载 knowledge 和 profiles 两个共享卷
#   - 探针打 /health 端点，确保服务真正可用后再接流量
#   - imagePullPolicy: IfNotPresent 避免每次重启都拉取镜像（生产建议改 Always）
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdp-team-webui
  namespace: wdp-team  # 请根据实际 namespace 调整
  labels:
    app: wdp-team-platform
    component: webui
spec:
  replicas: 2  # 双副本高可用
  selector:
    matchLabels:
      app: wdp-team-platform
      component: webui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 滚动更新时最多多创建 1 个 Pod
      maxUnavailable: 0  # 滚动更新时保证至少 1 个 Pod 可用（配合 replicas=2）
  template:
    metadata:
      labels:
        app: wdp-team-platform
        component: webui
    spec:
      # 注意：WebUI 不能设 securityContext.runAsUser！
      # 官方启动脚本 /hermeswebui_init.bash 必须以 root 启动（做 UID 对齐、
      # rsync /apptoo→/app、chown），完成后自行降权到 hermeswebui(1024) 运行。
      # 强制 runAsUser:1024 会导致 init 脚本权限不足直接退出（已踩坑）。
      containers:
        - name: webui
          image: harbor.51vr.local/wdp-service/wdp-team-platform:3
          # IfNotPresent: 优先使用本地已有镜像，避免每次重启都拉取
          # 注意：同 tag 覆盖推送不会生效，每次改镜像递增 tag（1→2→3）
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
              protocol: TCP
          env:
            # ---- 基础网络配置 ----
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"   # 绑定所有接口，K8s Pod 内必须
            - name: HERMES_WEBUI_PORT
              value: "8787"
            # ---- 多用户模式开关 ----
            - name: HERMES_WEBUI_MULTIUSER
              value: "1"         # 1 = 开启多用户团队模式
            # ---- Agent 源码路径 ----
            # 指向容器内 agent 源码目录，WebUI 会从此目录启动 agent 子进程
            # 与 Dockerfile 中 COPY agent-src/ → /opt/hermes 保持一致
            - name: HERMES_WEBUI_AGENT_DIR
              value: "/opt/hermes"
            # ---- Hermes Home（当前 profile 状态目录）----
            # 存放 WebUI 会话、工作区、设置等状态
            - name: HERMES_HOME
              value: "/data/profiles/default"
            # 团队级配置锚点：SOUL.md/config.yaml/integrations.json/快照/技能草稿的确定性位置。
            # 必须显式设置——运行时 HERMES_HOME 会被多用户 per-request profile 切换改写，
            # 且 default profile 会被解析成 base home(/data)，造成团队文件读写错位
            # （团队Agent页全空 + /data 下 Permission denied 的根因）。
            - name: HERMES_TEAM_HOME
              value: "/data/profiles/default"
            # 团队技能目录：可写卷优先(UI 发布即时生效) + 镜像内置只读兜底(逗号分隔，
            # 万一可写卷播种失败仍能读到镜像技能)。启动 backfill 把镜像技能播种到可写卷。
            - name: WDP_TEAM_SKILLS_DIR
              value: "/data/profiles/default/team-skills,/opt/hermes-team-skills"
            # 成员 profile 父目录：发布团队规则时遍历此目录下每个成员 profile。
            # 生产成员在 /data/profiles/<user>（团队根 default 的兄弟），显式指定避免
            # "团队根/profiles" 误拼成 /data/profiles/default/profiles(不存在→发布0个成员)。
            - name: HERMES_PROFILES_ROOT
              value: "/data/profiles"
            # ---- WebUI 状态目录 ----
            # 默认在 HERMES_HOME/webui 下，显式指定到共享 profiles 卷
            - name: HERMES_WEBUI_STATE_DIR
              value: "/data/profiles/default/webui"
            # ---- 团队知识库路径 ----
            # WebUI 和 Agent 会读取此目录下的共享知识/技能
            - name: HERMES_KNOWLEDGE_DIR    # ⚠️ 代码读的是这个名字（api/knowledge.py 等 7 处）
              value: "/data/knowledge"
            - name: WDP_SCHEDULER_ENABLED   # 定时任务单点执行：仅主副本设 1，多副本时其余设 0
              value: "1"
            # ---- gitlab 凭据（从 Secret 引用）----
            # 配合镜像内 git credential.helper（读 GIT_USER/GIT_TOKEN 环境变量），
            # 容器内对 gitlab 的 push/pull 自动带凭据。Secret 需运维提前创建：
            #   kubectl create secret generic wdp-team-git-secret -n wdp-team \
            #     --from-literal=GIT_USER=xxx --from-literal=GIT_TOKEN=xxx
            - name: GIT_USER
              valueFrom:
                secretKeyRef:
                  name: wdp-team-git-secret
                  key: GIT_USER
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wdp-team-git-secret
                  key: GIT_TOKEN
            # ---- 企业微信文档 MCP apikey（从 Secret 引用）----
            # config.yaml 里 mcp_servers.wecom_doc 的 URL 用 ${WECOM_MCP_APIKEY} 占位，
            # Hermes 启动时展开为此环境变量值。Secret 需运维提前创建（一次即可）：
            #   kubectl create secret generic wdp-team-wecom-secret -n wdp-team \
            #     --from-literal=WECOM_MCP_APIKEY=<企微机器人文档MCP的apikey>
            # 未创建该 Secret 时 Pod 起不来（optional:true 可容忍缺失，见下）。
            - name: WECOM_MCP_APIKEY
              valueFrom:
                secretKeyRef:
                  name: wdp-team-wecom-secret
                  key: WECOM_MCP_APIKEY
                  optional: true
            # ---- 可选：跳过权限修复（共享卷场景下避免冲突）----
            - name: HERMES_SKIP_CHMOD
              value: "1"
            # ---- 运行时依赖安装镜像源（内网访问不了 pypi.org）----
            # docker_init.bash 首次启动会在线安装 web-ui/agent 依赖，uv/pip 都认这两个变量
            - name: UV_INDEX_URL
              value: "https://mirrors.aliyun.com/pypi/simple/"
            - name: PIP_INDEX_URL
              value: "https://mirrors.aliyun.com/pypi/simple/"
          resources:
            requests:
              cpu: "2"       # 请求 2 核，保证调度到有足够资源的节点
              memory: "4Gi"  # 请求 4G 内存
            limits:
              cpu: "4"       # 上限 4 核
              memory: "8Gi"  # 上限 8G 内存
          # ---- 存活探针：检测进程是否还活着 ----
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
              scheme: HTTP
            initialDelaySeconds: 600  # 首次启动要在线安装依赖，给足 10 分钟（已踩坑：75s 被探针杀）
            periodSeconds: 15         # 每 15 秒探测一次
            timeoutSeconds: 5         # 每次探测超时 5 秒
            failureThreshold: 3       # 连续失败 3 次则重启容器
          # ---- 就绪探针：检测是否准备好接流量 ----
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
              scheme: HTTP
            initialDelaySeconds: 10   # 启动后 10 秒开始探测
            periodSeconds: 10         # 每 10 秒探测一次
            timeoutSeconds: 5         # 每次探测超时 5 秒
            failureThreshold: 60      # 首次初始化慢，容忍 10 分钟内未就绪（不重启只摘流量）
          volumeMounts:
            # 挂载团队知识库共享卷
            - name: knowledge-volume
              mountPath: /data/knowledge
            # 挂载用户目录共享卷
            - name: profiles-volume
              mountPath: /data/profiles
      volumes:
        # 引用 PVC：团队知识库
        - name: knowledge-volume
          persistentVolumeClaim:
            claimName: wdp-team-knowledge
        # 引用 PVC：用户目录
        - name: profiles-volume
          persistentVolumeClaim:
            claimName: wdp-team-profiles
      imagePullSecrets:
        - name: images-51aes
      nodeSelector:
        role: worker
