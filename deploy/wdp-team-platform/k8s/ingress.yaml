# ==============================================================================
# WDP 团队 AI 工作台 — Ingress
# ==============================================================================
# 作用：
#   提供集群外部访问入口，配置 TLS 加密和会话亲和（Sticky Session）。
#
# 运维必改项：
#   1. host: 将 team.wdp.example.com 替换为实际域名
#   2. TLS secretName: 将 wdp-team-tls-secret 替换为实际的证书 Secret 名称
#      （可使用 cert-manager 自动签发，或手动 kubectl create secret tls）
#   3. 根据实际 Ingress Controller 调整 className 和 annotations
#
# Sticky Session 说明：
#   WebUI 使用 SSE (Server-Sent Events) 长连接，会话状态保存在 Pod 内存中。
#   必须配置基于 cookie 的会话亲和，确保同一用户的请求始终路由到同一 Pod。
#   以下 annotations 为 nginx ingress 的示例，其他控制器（如 Traefik、ALB）
#   请参考对应文档配置等效规则。
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wdp-team-ingress
  namespace: wdp-team  # 请根据实际 namespace 调整
  labels:
    app: wdp-team-platform
    component: ingress
  annotations:
    # ---- nginx ingress 会话亲和配置 ----
    # 基于 cookie 的 sticky session，确保同一用户的 SSE 连接始终落到同一 Pod
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "hermes_session"
    # 可选：同时兼容 hermes_profile cookie（多用户场景下双保险）
    # nginx.ingress.kubernetes.io/session-cookie-name: "hermes_profile"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"  # 1 天
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    # ---- 超时配置（SSE 长连接需要较长超时）----
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # 1 小时
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"   # 1 小时
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # ---- 上传大小限制（文件上传场景）----
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # ---- WebSocket / SSE 支持 ----
    nginx.ingress.kubernetes.io/websocket-services: "wdp-team-webui"
    # ---- SSL 重定向 ----
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  # TODO: 根据实际 Ingress Controller 调整（nginx, traefik, alb 等）
  ingressClassName: nginx
  tls:
    - hosts:
        # TODO: 运维请替换为实际域名
        - team.wdp.example.com
      # TODO: 运维请替换为实际 TLS 证书 Secret 名称
      # 创建方式示例：
      #   kubectl create secret tls wdp-team-tls-secret \
      #     --cert=path/to/tls.crt --key=path/to/tls.key -n wdp-team
      secretName: wdp-team-tls-secret
  rules:
    # TODO: 运维请替换为实际域名
    - host: team.wdp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wdp-team-webui
                port:
                  number: 8787
