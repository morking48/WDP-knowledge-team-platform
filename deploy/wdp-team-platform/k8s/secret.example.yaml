# ==============================================================================
# WDP 团队 AI 工作台 — Secret 示例文件
# ==============================================================================
# 作用：
#   演示如何创建团队公共 LLM Key 的 Secret。
#   此文件仅作为模板参考，**严禁**将真实 API Key 提交到 Git 仓库！
#
# 运维操作指南：
#   1. 复制本文件为 secret.yaml（或直接用 kubectl 命令创建）
#   2. 将 <YOUR_OPENROUTER_API_KEY> 替换为真实的 API Key
#   3. 执行 kubectl apply -f secret.yaml 创建 Secret
#   4. 或者使用命令行直接创建（推荐，避免文件落盘）：
#
#      kubectl create secret generic wdp-team-llm-secret \
#        --from-literal=OPENROUTER_API_KEY="sk-or-v1-xxxxxxxxxxxx" \
#        -n wdp-team
#
#   5. 创建完成后，可删除本地 secret.yaml 文件，或确保它在 .gitignore 中
#
# 安全提醒：
#   - 真实 Secret 文件绝不能提交到 Git
#   - 建议将 secret.yaml 加入 .gitignore
#   - 生产环境建议使用外部密钥管理（如 Vault、阿里云 KMS、Sealed Secrets）
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: wdp-team-llm-secret
  namespace: wdp-team  # 请根据实际 namespace 调整
  labels:
    app: wdp-team-platform
    component: secret
type: Opaque
stringData:
  # TODO: 替换为真实的 OpenRouter API Key
  # 获取地址：https://openrouter.ai/keys
  OPENROUTER_API_KEY: "<YOUR_OPENROUTER_API_KEY>"
  # Claude fallback（n1n.ai 代理）——主模型不可用时自动降级到 claude 用
  # 团队 config fallback 链依赖此 Key，见 team-config/config.yaml.fallback-template
  N1N_CLAUDE_KEY: "<YOUR_N1N_CLAUDE_KEY>"
  # 如需其他 LLM 提供商的 Key，可继续添加：
  # OPENAI_API_KEY: "<YOUR_OPENAI_API_KEY>"
  # ANTHROPIC_API_KEY: "<YOUR_ANTHROPIC_API_KEY>"
