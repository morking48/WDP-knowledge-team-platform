# ==============================================================================
# WDP 团队 AI 工作台 — 共享存储卷 (PersistentVolumeClaim)
# ==============================================================================
# 作用：
#   为 WebUI 多副本和主 Agent 提供共享持久化存储。
#   两个 PVC 均使用 ReadWriteMany (RWX) 访问模式，因为：
#     - WebUI 有 2 个副本，需要同时挂载读写
#     - 主 Agent 也需要挂载同一套 knowledge / profiles 目录
#
# 运维注意：
#   storageClassName 为占位符，请根据实际集群环境替换为可用的 StorageClass。
#   常见可选值：
#     - 阿里云 ACK:  alicloud-disk-ssd / alicloud-nas
#     - 腾讯云 TKE:  cbs / cfs
#     - 自建集群:    nfs-client / longhorn / cephfs 等
#   如果集群没有支持 RWX 的 StorageClass，需要先部署 NFS provisioner 或
#   使用 CephFS / Longhorn 等支持多节点读写的存储方案。
# ==============================================================================

---
# ------------------------------------------------------------------------------
# PVC 1: 团队知识库卷
# 存放团队共享的知识库文件、技能库、文档等
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wdp-team-knowledge
  namespace: wdp-team  # 请根据实际 namespace 调整
  labels:
    app: wdp-team-platform
    component: storage
spec:
  accessModes:
    - ReadWriteMany  # 多节点同时读写
  storageClassName: ""                 # 静态 PV 绑定，不走动态供给
  volumeName: wdp-team-knowledge-pv    # 绑定 k8s/pv.yaml 中的静态 NFS PV
  resources:
    requests:
      storage: 50Gi  # 团队知识库容量，可按需调整

---
# ------------------------------------------------------------------------------
# PVC 2: 用户目录卷
# 存放各用户的个人 profile 目录（会话记录、工作区、配置等）
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wdp-team-profiles
  namespace: wdp-team  # 请根据实际 namespace 调整
  labels:
    app: wdp-team-platform
    component: storage
spec:
  accessModes:
    - ReadWriteMany  # 多节点同时读写
  storageClassName: ""                 # 静态 PV 绑定，不走动态供给
  volumeName: wdp-team-profiles-pv     # 绑定 k8s/pv.yaml 中的静态 NFS PV
  resources:
    requests:
      storage: 100Gi  # 用户目录容量，可按团队规模调整
